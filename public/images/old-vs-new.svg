ivate link</text><rect x="334" y="82" width="66" height="116" rx="12" fill="#FFFFFF" stroke="#3F2A16" stroke-width="2"/><rect x="342" y="94" width="50" height="46" rx="7" fill="#3F2A16"/><circle cx="367" cy="112" r="11" fill="#C9A24B" opacity="0.85"/><rect x="350" y="128" width="34" height="4" rx="2" fill="#E8D3A8"/><rect x="358" y="160" width="18" height="14" rx="3" fill="#2E7D4F"/><path d="M361 160 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#2E7D4F" stroke-width="2.5"/><text x="367" y="190" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#1F6B3F" text-anchor="middle">Private</text><line x1="404" y1="140" x2="480" y2="140" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round"/><polyline points="472.8,143.5 480,140 472.8,136.5" fill="none" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="516" cy="130" r="12" fill="#FFFFFF" stroke="#3F2A16" stroke-width="2"/><path d="M496 168 Q496 146 516 146 Q536 146 536 168 Z" fill="#FFFFFF" stroke="#3F2A16" stroke-width="2" stroke-linejoin="round"/><circle cx="534" cy="118" r="8" fill="#2E7D4F"/><polyline points="530,118 533,121 538,115" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="516" y="190" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F6B3F" text-anchor="middle">Only the person</text><text x="516" y="204" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F6B3F" text-anchor="middle">you chose</text><rect x="324" y="238" width="262" height="76" rx="12" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/><path d="M344 252 L362 258 L362 274 Q362 286 344 292 Q326 286 326 274 L326 258 Z" transform="translate(7 0)" fill="#2E7D4F"/><polyline points="341,272 346,277 356,265" transform="translate(7 0)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="262" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1F6B3F">You decide who sees it</text><text x="376" y="278" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1F6B3F">Photo blurred, phone hidden</text><text x="376" y="298" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B5F52">Switch it off any time</text><circle cx="300" cy="165" r="15" fill="#3F2A16"/><text x="300" y="169.5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">VS</text></svg>